name: VirtualAgentCafe checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Python in the approved sandbox runtime directory
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-venv bubblewrap
          sudo /usr/bin/python3 -m venv /opt/venv
          sudo chown -R "$(id -u):$(id -g)" /opt/venv
          echo /opt/venv/bin >> "$GITHUB_PATH"
      - name: Install backend and test tools
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps -e backend
      - name: Install pinned Codex CLI for offline authentication regression
        run: npm install -g @openai/codex@0.162.1
      - name: Install Godot 4.4.1
        run: |
          curl -fsSL https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install /tmp/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Require real workspace isolation on the CI runner
        run: bash scripts/ci-sandbox.sh
      - name: Ruff lint and formatting
        run: scripts/check.sh lint
      - name: Complete backend, controller and GUI regression suite
        run: scripts/check.sh pytest
      - name: Godot project import
        run: scripts/check.sh godot-import
      - name: Godot state tests
        run: scripts/check.sh godot-states
      - name: Godot headless launch
        run: scripts/check.sh godot-headless
      - name: Backend to Godot WebSocket smoke test
        run: scripts/check.sh websocket-smoke
      - name: Render shaders and UI preview
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libxkbcommon-x11-0
          mkdir -p /tmp/cafe-previews
          xvfb-run -a env VAC_PREVIEW_DIR=/tmp/cafe-previews godot --path game --resolution 3840x2160 --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/render_preview.gd 2>&1 | tee /tmp/cafe-render.log
          if rg -q 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/cafe-render.log; then exit 1; fi
      - name: Render management pages and exercise real GUI input
        run: |
          xvfb-run -a env VAC_PREVIEW_DIR=/tmp/cafe-previews godot --path game --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/render_management.gd 2>&1 | tee /tmp/management-render.log
          if rg -q 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/management-render.log; then exit 1; fi
          xvfb-run -a env VAC_GUI_RENDERED=1 VAC_GUI_RESOLUTION=1920x1080 python -m pytest backend/tests/test_game_management.py -q -k "gui_input or setup_input"
      - name: Render full managed task pipeline and verify published product
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 scripts/check.sh pipeline-gui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cafe-pipeline-evidence
          path: .runtime/checks/pipeline-gui/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: cafe-rendered-previews
          path: /tmp/cafe-previews/*.png
      - name: Validate Compose and secret-free build context
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.privileged.yaml --profile dev config --quiet
      - name: Container smoke test
        run: |
          trap 'docker compose down' EXIT
          docker compose up --build -d --wait backend
          curl --fail http://127.0.0.1:8000/health
